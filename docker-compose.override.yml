services:
  catalog.db:
    container_name: catalog.db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=CatalogDb
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/data
    
  catalog.seq:
    container_name: catalog.seq
    image: datalust/seq:latest
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:5341"
      - "8082:80"
    
  catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=tuantai0708
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/app/certificates/aspnetapp.pfx

      - ConnectionStrings__Database=Server=catalog.db;Port=5434;Database=CatalogDb;User Id=postgres;Password=123456;Include Error Detail=true

    depends_on:
      - catalog.db
      - catalog.seq
    ports:
      - "5000:8080"
      - "5100:8081"
    volumes:
      - ./containers/usersecrets:/home/app/.microsoft/usersecrets:ro
      - ./containers/https:/home/app/.aspnet/https:ro

  basket.db:
    container_name: basket.db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=BasketDb
    restart: always
    ports:
      - "5435:5432"
    volumes:
      - postgres_basket:/var/lib/postgresql/data
      
  basket.cache:
    container_name: basket.cache
    restart: always
    ports:
      - "6379:6379"
        
  basket.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=tuantai0708
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/app/certificates/aspnetapp.pfx

      - ConnectionStrings__Redis=basket.cache:6379
      - ConnectionStrings__Database=Server=catalog.db;Port=5435;Database=BasketDb;User Id=postgres;Password=123456;Include Error Detail=true
  

